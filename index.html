<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ignição · PH</title>
<style>
  :root{
    --bg:#0a0d0f; --card:#11181c; --card2:#161f24; --line:#233037;
    --ember:#2fc7e8; --ember-soft:rgba(47,199,232,.13);
    --text:#eef5f7; --muted:#94a6ae; --dim:#5f7178;
    --disp:'Avenir Next Condensed','Arial Narrow',system-ui,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}
  body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.5;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px 90px}

  header{padding:22px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .cal-btn{background:var(--card);border:1px solid var(--line);border-radius:99px;height:42px;padding:0 16px;
    font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:13px;
    color:var(--text);cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap;flex:0 0 auto}
  .cal-btn.on{border-color:var(--ember);color:var(--ember);box-shadow:0 0 0 1px var(--ember)}
  .stats{margin:2px 0 10px}
  .brand{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:15px}
  .brand em{color:var(--ember);font-style:normal}
  .stats{font-size:12px;color:var(--dim);letter-spacing:.04em;font-variant-numeric:tabular-nums}

  .chipwrap{position:relative}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:6px 34px 14px 0;scrollbar-width:none;scroll-behavior:smooth}
  .chips::-webkit-scrollbar{display:none}
  .chip-arrow{position:absolute;right:-2px;top:2px;bottom:10px;width:56px;border:none;cursor:pointer;
    background:linear-gradient(90deg,transparent,var(--bg) 55%);color:var(--ember);
    font-size:22px;font-weight:700;text-align:right;padding-right:4px;transition:opacity .2s}
  .chip-arrow.off{opacity:0;pointer-events:none}
  .chip{flex:0 0 auto;font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    font-size:12.5px;color:var(--muted);border:1px solid var(--line);background:transparent;
    padding:7px 13px;border-radius:99px;cursor:pointer;transition:.15s}
  .chip.on{color:var(--bg);background:var(--ember);border-color:var(--ember)}

  /* CARTÃO DE IGNIÇÃO */
  .stage{margin-top:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 26px 24px;
    min-height:340px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
  .card::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--ember),transparent 70%)}
  .mode{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:12.5px;color:var(--ember)}
  .pre{font-size:13.5px;color:var(--dim);font-style:italic}
  .txt{font-family:var(--disp);font-weight:600;font-size:clamp(25px,6.4vw,34px);line-height:1.14;text-wrap:balance;flex:1}
  .who{font-size:13.5px;color:var(--muted);letter-spacing:.02em}
  .who b{color:var(--text);font-weight:600}
  .hook{border-left:2px solid var(--ember);padding:2px 0 2px 12px;font-size:14.5px;color:var(--muted)}
  .hook b{color:var(--ember);font-weight:600;letter-spacing:.06em;font-size:12px;text-transform:uppercase;font-family:var(--disp);display:block;margin-bottom:2px}
  .state{position:absolute;top:16px;right:18px;font-size:12px;color:var(--dim);display:flex;gap:8px}
  .state span{border:1px solid var(--line);border-radius:99px;padding:2px 9px}
  .state .fav{color:#e8b04c;border-color:#4a3c22}
  .state .used{color:var(--muted)}

  .actions{display:flex;gap:10px;margin-top:14px}
  button.act{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:14px;
    border-radius:10px;padding:15px 10px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);flex:1;transition:.15s}
  button.act:active{transform:scale(.97)}
  .draw{background:var(--ember)!important;color:#04161c!important;border-color:var(--ember)!important;flex:1.6!important;font-size:15px!important}
  .toggled{color:var(--ember)!important;border-color:var(--ember)!important}

  .hint{text-align:center;color:var(--dim);font-size:12px;margin-top:14px;letter-spacing:.03em}

  /* ACERVO */
  .tabs{display:flex;gap:22px;margin:30px 0 6px;border-bottom:1px solid var(--line)}
  .tab{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:14px;
    color:var(--dim);background:none;border:none;padding:10px 2px;cursor:pointer;border-bottom:2px solid transparent}
  .tab.on{color:var(--text);border-bottom-color:var(--ember)}
  .group-h{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:14px;
    color:var(--ember);margin:30px 0 10px;display:flex;align-items:baseline;gap:10px}
  .group-h small{color:var(--dim);font-size:12px;letter-spacing:.06em;font-family:var(--body);font-weight:400}
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ember);border-radius:10px;transition:.12s}
  .row:active{transform:scale(.99)}
  .row .body{flex:1;min-width:0}
  .row p{font-size:15.5px;color:var(--text);font-weight:500;line-height:1.4}
  .row .src{font-size:12.5px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
  .row.u{border-left-color:var(--line)}
  .row.u p{color:var(--dim);font-weight:400}
  .row .m{font-size:14px;flex:0 0 auto;padding-top:2px;color:var(--muted)}
  .row .m .fv{color:#e8c04c}
  .empty{color:var(--dim);font-size:14px;padding:30px 0;text-align:center}
  .hidden{display:none}

  /* CALENDÁRIO */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 6px}
  .cal-head h2{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:19px}
  .cal-nav{display:flex;gap:8px}
  .cal-nav button{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:8px;
    width:38px;height:38px;font-size:17px;cursor:pointer}
  .cal-streak{font-size:12.5px;color:var(--dim);margin-bottom:14px;letter-spacing:.03em}
  .cal-streak b{color:var(--ember)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .cal-wd{font-family:var(--disp);font-weight:700;font-size:11.5px;color:var(--dim);text-align:center;
    text-transform:uppercase;letter-spacing:.08em;padding:4px 0}
  .cal-d{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:74px;padding:6px 5px 5px;
    cursor:pointer;display:flex;flex-direction:column;gap:3px;position:relative;transition:.12s;min-width:0;overflow:hidden}
  @media(max-width:420px){.cal-d .tag{font-size:9px;letter-spacing:.02em}.cal-d{min-height:66px;padding:5px 3px 4px}}
  .cal-d:active{transform:scale(.96)}
  .cal-d .n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .cal-d .tag{font-family:var(--disp);font-weight:600;font-size:10.5px;line-height:1.15;text-transform:uppercase;
    letter-spacing:.04em;color:var(--ember);text-wrap:balance}
  .cal-d.free{background:transparent;cursor:default}
  .cal-d.free .tag{color:var(--dim);font-weight:400}
  .cal-d.out{opacity:.28}
  .cal-d.today{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}
  .cal-d.done{background:var(--ember-soft);border-color:transparent}
  .cal-d .ok{position:absolute;bottom:4px;right:6px;font-size:12px;color:var(--ember)}
  .cal-legend{margin-top:18px;display:flex;flex-direction:column;gap:6px}
  .cal-legend .lg{font-size:13px;color:var(--muted)}
  .cal-legend .lg b{color:var(--text);font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:12.5px;font-weight:700}
  /* painel do dia */
  .day-panel{position:fixed;inset:auto 0 0 0;background:var(--card2);border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;padding:26px 22px 34px;z-index:60;max-width:640px;margin:0 auto}
  .day-panel .mode{margin-bottom:4px}
  .day-panel h3{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:23px;letter-spacing:.03em;margin-bottom:4px}
  .day-panel .cats{color:var(--muted);font-size:13px;margin-bottom:14px}
  .day-panel .catlist{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
  .catbtn{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:15px;
    text-align:left;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ember);
    color:var(--text);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .catbtn small{color:var(--dim);font-family:var(--body);font-weight:400;letter-spacing:0;text-transform:none;font-size:12.5px}
  .catbtn:active{transform:scale(.98)}
  .day-panel .actions{margin-top:0}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}
  /* PERFIS */
  .user-chip{background:var(--card);border:1px solid var(--line);border-radius:99px;height:30px;padding:0 12px;
    font-size:12px;color:var(--muted);cursor:pointer;font-weight:600}
  .profile-overlay{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;
    justify-content:center;align-items:center;gap:14px;padding:8vw}
  .profile-overlay h2{font-family:var(--disp);text-transform:uppercase;font-size:24px;letter-spacing:.08em}
  .profile-overlay p{color:var(--muted);font-size:14px;margin-bottom:10px;text-align:center}
  .pbtn{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:16px;
    background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;
    padding:16px;width:100%;max-width:340px;cursor:pointer}
  .pbtn:active{transform:scale(.98)}
  /* PIPELINE / EDITOR DO DIA */
  .pilar-row{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 12px}
  .pilar-b{font-family:var(--disp);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
    border-radius:99px;padding:7px 11px;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--muted)}
  .pilar-b.on{color:#0a0d0f;font-weight:700}
  .tema-sel{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:9px;
    padding:11px;font-size:14px;margin-bottom:12px;font-family:var(--body)}
  .st-row{display:flex;gap:6px;margin-bottom:14px}
  .st-b{flex:1;font-family:var(--disp);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:8px;padding:9px 2px;cursor:pointer}
  .st-b.on{background:var(--ember);border-color:var(--ember);color:#04161c;font-weight:700}
  .cal-d .pdot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%}
  .cal-d .stb{position:absolute;bottom:4px;right:6px;font-size:10px;font-weight:700}
  /* IDEIAS */
  .idea-fab{position:fixed;bottom:22px;right:18px;z-index:40;background:var(--ember);color:#04161c;border:none;
    border-radius:99px;height:52px;padding:0 20px;font-family:var(--disp);font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;font-size:14px;cursor:pointer;box-shadow:0 4px 18px rgba(47,199,232,.35)}
  .idea-modal{position:fixed;inset:auto 0 0 0;background:var(--card2);border-top:1px solid var(--line);z-index:60;
    border-radius:18px 18px 0 0;padding:24px 22px 34px;max-width:640px;margin:0 auto}
  .idea-modal h3{font-family:var(--disp);text-transform:uppercase;font-size:19px;margin-bottom:12px}
  .idea-modal textarea{width:100%;min-height:90px;background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:12px;font-size:15px;font-family:var(--body);margin-bottom:10px;resize:vertical}
  .row .by{color:var(--dim);font-size:11.5px;margin-top:3px}
  /* ASSISTENTE SEMANAL */
  .wiz{position:fixed;inset:0;background:var(--bg);z-index:70;overflow-y:auto;padding:20px 18px 40px}
  .wiz-in{max-width:640px;margin:0 auto}
  .wiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .wiz-top h2{font-family:var(--disp);text-transform:uppercase;font-size:20px;letter-spacing:.06em}
  .wiz-prog{color:var(--dim);font-size:12.5px;margin-bottom:18px}
  .wiz-day{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:26px;margin:6px 0 2px}
  .wiz-q{color:var(--muted);font-size:14px;margin-bottom:12px}
  .sug{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ember);border-radius:10px;
    padding:13px 15px;font-size:14.5px;cursor:pointer;margin-bottom:8px;color:var(--text)}
  .sug small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
  .sug.on{border-color:var(--ember);background:var(--ember-soft)}
  .wiz-skip{background:none;border:none;color:var(--dim);font-size:13px;cursor:pointer;padding:8px 0;text-decoration:underline}
  .wiz-sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:14px}
  .wiz-sum b{font-family:var(--disp);text-transform:uppercase;font-size:12px;letter-spacing:.06em}

  /* ALERTA DE GRAVAÇÃO */
  .alertbar{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ember);border-radius:12px;
    padding:13px 15px;margin:2px 0 12px;display:flex;align-items:center;gap:12px}
  .alertbar .tx{flex:1;font-size:14px;color:var(--muted)}
  .alertbar .tx b{color:var(--text)}
  button.act:disabled{opacity:.45;cursor:default;transform:none}

  /* MODO FOCO */
  .focus-overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;
    justify-content:center;padding:8vw;gap:22px}
  .focus-overlay .txt{font-size:clamp(30px,8vw,52px);flex:0}
  .focus-close{position:absolute;top:20px;right:22px;background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:99px;width:38px;height:38px;font-size:16px;cursor:pointer}
  .rec{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--disp);font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:#d43c3c;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  button:focus-visible,.chip:focus-visible,.row:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
</style>

<div class="wrap">
  <header>
    <div class="brand">Ignição <em>·</em> PH</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="user-chip" id="userChip" title="Trocar perfil">👤</button>
      <button class="cal-btn" id="btnDrive" title="Pasta dos vídeos no Drive">📁 Drive</button>
      <button class="cal-btn" id="btnCal">📅 Calendário</button>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div id="alert"></div>

  <div class="chipwrap">
    <div class="chips" id="chips"></div>
    <button class="chip-arrow" id="chipArrow" aria-label="Mais categorias">›</button>
  </div>

  <div class="tabs">
    <button class="tab on" id="tabAll">Acervo</button>
    <button class="tab" id="tabDraw">Sorteio</button>
  </div>

  <section class="stage" id="stage">
    <div class="card" id="card" role="button" tabindex="0" title="Toque para modo foco"></div>
    <div class="actions">
      <button class="act draw" id="btnDraw">🎲 Me provoca</button>
      <button class="act" id="btnUsed">✓ Gravei</button>
      <button class="act" id="btnFav">☆</button>
    </div>
    <p class="hint">Toque no cartão para o modo foco · marque <b>Gravei</b> para não repetir</p>
  </section>

  <section id="list" class="hidden"></section>
  <section id="cal" class="hidden"></section>
</div>

<script>
const CATS={
  sto:{n:'Estoicos',pre:'“Tem uma frase de 2.000 anos que resolve um problema de hoje:”'},
  ceo:{n:'CEOs & líderes',pre:'“Li uma frase que não me sai da cabeça:”'},
  liv:{n:'Livros',pre:'“Esse livro me pegou numa frase:”'},
  tri:{n:'Trilhas de raciocínio',pre:'“Deixa eu pensar alto com você:”'},
  fra:{n:'Complete a frase',pre:'“Vou começar uma frase — e terminar com a minha verdade:”'},
  tes:{n:'Teses',pre:'“Me jogaram uma tese que me incomodou:”'},
  tem:{n:'Temas do radar',pre:'“Tem um assunto que o mercado inteiro tá discutindo:”'},
  per:{n:'Perguntas',pre:'“Me fizeram uma pergunta que me travou:”'},
  mar:{n:'Marcos & histórias',pre:'“Deixa eu te contar uma história que tem tudo a ver com transporte:”'},
  col:{n:'Colisões',pre:'“Dois mundos que não se falam — e deviam:”'},
  ten:{n:'Tensões',pre:'“Tem uma tensão que eu vivo todo dia:”'},
  pov:{n:'Pontos de vista',pre:'“Hoje eu quero olhar isso por outros olhos:”'}
};
// [cat, texto, autor/fonte, gancho]
const DATA=[
// PERGUNTAS — decisão & risco
['per','Qual foi a última decisão que você tomou sozinho e queria ter dividido com alguém?'],
['per','Que oportunidade você recusou recentemente — e o que a recusa diz sobre sua estratégia?'],

['per','Se tivesse que cortar um dos seus projetos amanhã, qual critério usaria?'],
['per','Qual foi o "não" mais caro que você já disse? E o "sim" que saiu mais caro ainda?'],
['per','Que decisão pequena virou um padrão grande dentro da empresa?'],
// perguntas — cultura & pessoas
['per','O que você tolera no time hoje que sabe que não deveria tolerar?'],
['per','Qual comportamento você demitiria mesmo vindo de quem entrega resultado alto?'],
['per','O que seu time resolve hoje sem você que há um ano dependia de você?'],

['per','Qual ritual da empresa você defenderia até o fim — e por que ele existe?'],
['per','Quem te deu o feedback mais duro da sua carreira — e o que ficou dele?'],
// perguntas — construção & tecnologia
['per','Qual automação sua ninguém percebeu que existe — e qual todo mundo percebeu no dia 1?'],
['per','O que a IA ainda não resolve na sua empresa — e você desconfia que nunca vai resolver?'],
['per','Qual ferramenta você abandonou depois de investir tempo e dinheiro? O que ela te ensinou?'],
['per','Se recomeçasse a Unity hoje, com as ferramentas de hoje, o que faria diferente no dia 1?'],
['per','Qual foi a última coisa que você construiu com as próprias mãos — e que problema ela resolve?'],
['per','O que os gurus de IA falam que te faz balançar a cabeça?'],
['per','Que dor da sua operação ainda não virou produto — e por que ainda não?'],
['per','Se pudesse mexer na operação do seu cliente, o que removeria primeiro?'],
// perguntas — setor & visão
['per','O que todo mundo no transporte aceita como "normal" que você acha inaceitável?'],
['per','Que mudança silenciosa está acontecendo no setor que quase ninguém comenta?'],
['per','Onde estará o dinheiro da logística daqui a 5 anos que hoje ninguém está olhando?'],
['per','O que uma indústria deveria perguntar à transportadora antes de contratar — e nunca pergunta?'],

// perguntas — trajetória & identidade
['per','O que o Philipe de 13 anos acharia da sua segunda-feira de hoje?'],
['per','Qual "cedo demais" da sua vida se provou na hora certa?'],
['per','O que você fingiu saber no começo — e quando parou de precisar fingir?'],
['per','Que conselho você recebeu, ignorou — e ainda bem que ignorou?'],
['per','Qual parte da sua história você ainda tem receio de contar? O que te segura?'],
['per','O que mudou na sua forma de decidir quando você virou pai?'],
['per','Que hábito de "gente grande" você adotou cedo — e qual rejeitou de propósito?'],

// Banco de ideias: sorteia mix de temas (💡) e ignições (🔥) escritos para o pilar
function bancoIdeias(pilar,n,excl){
  const sh=a=>[...a].sort(()=>Math.random()-.5);
  const ok=j=>IDEIAS[j][0]===pilar&&!(excl||[]).includes(j);
  const te=sh(IDEIAS.map((x,j)=>j).filter(j=>ok(j)&&IDEIAS[j][1]==='t'));
  const ig=sh(IDEIAS.map((x,j)=>j).filter(j=>ok(j)&&IDEIAS[j][1]==='i'));
  const out=[];
  while(out.length<n&&(te.length||ig.length)){
    if(te.length)out.push(te.shift());
    if(out.length<n&&ig.length)out.push(ig.shift());
  }
  return out;
}

      <button class="st-b ${md==='rec'?'on':''}" id="dpTabRec" ${hasPlan?'':'disabled title="Planeje o dia primeiro"'}>🎬 Gravar</button></div>`;
    const planBody=`
      <div class="pilar-row">${Object.entries(PILARES).map(([key,p])=>
        `<button class="pilar-b ${sel.p===key?'on':''}" data-p="${key}"
          style="${sel.p===key?`background:${p.c};border-color:${p.c}`:`color:${p.c};border-color:${p.c}55`}">${p.n}</button>`).join('')}
      </div>
      ${sel.p?`<div class="cats">💡 Banco de ideias · ${pil.n} <button class="wiz-skip" id="dpMais">🎲 outras</button><br>
        <small>Toque para marcar quantas quiser — quem grava escolhe uma delas na hora.</small></div>
      <div id="dpIdeias">${bank.map(j=>`<div class="sug ${sel.sug.includes(IDEIAS[j][2])?'on':''}" data-j="${j}">${IDEIAS[j][1]==='t'?'💡':'🔥'} ${IDEIAS[j][2]}</div>`).join('')}</div>
      <input class="tema-sel" id="dpLivre" placeholder="✍️ ou escreva uma sugestão e dê Enter…">
      ${outras.length?`<div class="cats">Também selecionadas (toque para remover):</div>
      <div>${outras.map((s,ix)=>`<div class="sug on" data-rm="${ix}">✕ ${esc(s)}</div>`).join('')}</div>`:''}
      ${sel.sug.length?`<div class="cats">✅ ${sel.sug.length} sugest${sel.sug.length>1?'ões':'ão'} pro dia</div>`:''}
      <div class="st-row">${STATUS.map((s,i)=>`<button class="st-b ${sel.st===i?'on':''}" data-st="${i}">${s}</button>`).join('')}</div>
      ${videoBlock}
      <div class="actions">
        <button class="act draw" id="dpIgn">🔥 Ver ignições do pilar</button>
        <button class="act" id="dpSave">Salvar</button>
        <button class="act" id="dpClear" style="flex:.6">🗑</button>
      </div>`:`<div class="cats">Escolha o pilar do dia para planejar.</div>`}`;
    const recBody=`
      ${pil?`<div class="cats" style="color:${pil.c};font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-weight:700">${pil.n}${sel.by?` · agenda por ${sel.by}`:''}</div>`:''}
      <div class="cats">🎬 Sugestões pra gravar — escolha uma:</div>
      <div>${sel.sug.map((s,ix)=>`<div class="sug ${sel.t===s?'on':''}" data-pk="${ix}">${sel.t===s?'🎥 ':''}${esc(s)}</div>`).join('')||'<div class="cats">Sem sugestões ainda — use a aba Planejar.</div>'}</div>
      <input class="tema-sel" id="recLivre" placeholder="✍️ ou grave outra ideia…" value="${esc(sel.t&&!sel.sug.includes(sel.t)?sel.t:'')}">
      ${sel.st>=1?`<div class="cats" style="color:#4ade80">● Gravada${sel.st>1?` — status atual: ${STATUS[sel.st].toLowerCase()}`:''}.</div>`:''}
      ${videoBlock}
      <div class="actions">
        <button class="act draw" id="recDone" ${sel.t?'':'disabled title="Escolha uma sugestão"'}>${sel.st>=1?'✓ Gravada':'✅ Gravei essa'}</button>
      </div>`;
    panel.innerHTML=`<div class="mode">${dd}/${mm} · ${md==='rec'?'gravação':'planejamento'}</div>
      ${tabs}${md==='rec'?recBody:planBody}`;
    const tp=panel.querySelector('#dpTabPlan'); if(tp)tp.onclick=()=>{md='plan';render()};
    const tr=panel.querySelector('#dpTabRec'); if(tr)tr.onclick=()=>{if(hasPlan){md='rec';render()}};
    panel.querySelectorAll('.pilar-b').forEach(b=>b.onclick=()=>{sel.p=b.dataset.p;bank=bancoIdeias(sel.p,4,[]);excl=[...bank];render()});
    const ms=panel.querySelector('#dpMais'); if(ms)ms.onclick=()=>{let nx=bancoIdeias(sel.p,4,excl);if(!nx.length){excl=[];nx=bancoIdeias(sel.p,4,[])}bank=nx;excl=excl.concat(nx);render()};
    panel.querySelectorAll('.sug[data-j]').forEach(s=>s.onclick=()=>{
      const tx=IDEIAS[+s.dataset.j][2];
      sel.sug=sel.sug.includes(tx)?sel.sug.filter(x=>x!==tx):[...sel.sug,tx];render()});
    panel.querySelectorAll('.sug[data-rm]').forEach(s=>s.onclick=()=>{
      sel.sug=sel.sug.filter(x=>x!==outras[+s.dataset.rm]);render()});
    panel.querySelectorAll('.sug[data-pk]').forEach(s=>s.onclick=()=>{sel.t=sel.sug[+s.dataset.pk];render()});
    const liv=panel.querySelector('#dpLivre'); if(liv)liv.onchange=()=>{
      const v=liv.value.trim(); if(v&&!sel.sug.includes(v)){sel.sug=[...sel.sug,v];render()}};
    const rlv=panel.querySelector('#recLivre'); if(rlv)rlv.onchange=()=>{if(rlv.value.trim()){sel.t=rlv.value.trim();render()}};
    panel.querySelectorAll('.st-b[data-st]').forEach(b=>b.onclick=()=>{sel.st=+b.dataset.st;render()});
    const ign=panel.querySelector('#dpIgn'); if(ign)ign.onclick=()=>{
      const cats=PILARES[sel.p].cats;
      const p2=DATA.map((d,i)=>i).filter(i=>cats.includes(DATA[i][0])&&!S.used.includes(i));
      persist();
      close();setView('draw');
      if(p2.length){cur=p2[Math.floor(Math.random()*p2.length)];cardEl.innerHTML=cardHTML(cur,false);stats();}
      window.scrollTo({top:0});
    };
    const sv=panel.querySelector('#dpSave'); if(sv)sv.onclick=()=>{
      const lv=panel.querySelector('#dpLivre');
      if(lv&&lv.value.trim()&&!sel.sug.includes(lv.value.trim()))sel.sug=[...sel.sug,lv.value.trim()];
      persist({by:S.user||sel.by});close();renderCal();renderAlert()};
    const vd=panel.querySelector('#dpVideo'); if(vd)vd.onchange=()=>{sel.video=vd.value.trim();persist();renderCal();render()};
    const dn=panel.querySelector('#recDone'); if(dn)dn.onclick=()=>{
      const rl=panel.querySelector('#recLivre'); if(rl&&rl.value.trim())sel.t=rl.value.trim();
      if(!sel.t)return;
      sel.st=Math.max(sel.st,1);persist();renderCal();renderAlert();render()};
    const cl=panel.querySelector('#dpClear'); if(cl)cl.onclick=()=>{
      if(!confirm('Apagar o planejamento deste dia?'))return;
      delete S.days[k];save();close();renderCal();renderAlert()};
  };
  const close=()=>{scrim.remove();panel.remove()};
  scrim.onclick=()=>{if(JSON.stringify(sel)!==clean&&!confirm('Fechar sem salvar as mudanças?'))return;close()};
  document.body.append(scrim,panel);
  render();
}
// Acesso ao Drive: usa o link oficial (DRIVE_URL) ou o configurado neste aparelho (S.drive)
const driveUrl=()=>DRIVE_URL||S.drive||'';
$('btnDrive').onclick=()=>{
  const u=driveUrl();
  if(u){window.open(u,'_blank','noopener');return}
  const v=prompt('Cole o link da pasta do Drive dos vídeos:');
  if(!v)return;
  const url=v.trim();
  if(!/^https?:\/\//.test(url)){alert('Link inválido — cole a URL completa (https://…)');return}
  S.drive=url;save();window.open(url,'_blank','noopener');
};
// Alerta: hoje tem conteúdo planejado pra gravar
function renderAlert(){
  const el=$('alert'); if(!el)return;
  const k=iso(new Date()), a=S.days[k];
  const n=a&&a.sug?a.sug.length:(a&&a.t?1:0);
  if(a&&a.p&&a.st===0&&n){
    el.innerHTML=`<div class="alertbar"><div class="tx">🎬 <b>Hoje tem gravação</b> · ${PILARES[a.p].n} — ${n} sugest${n>1?'ões':'ão'}${a.by?` de ${a.by}`:''}</div>
      <button class="act draw" id="alertGo" style="flex:0 0 auto;padding:10px 14px;font-size:12px">Escolher e gravar</button></div>`;
    $('alertGo').onclick=()=>dayPanel(k,'rec');
  } else el.innerHTML='';
}
$('btnDraw').onclick=draw;
$('btnUsed').onclick=()=>{if(cur<0)return;S.used.includes(cur)?S.used=S.used.filter(x=>x!==cur):S.used.push(cur);save();stats();};
$('btnFav').onclick=()=>{if(cur<0)return;S.fav.includes(cur)?S.fav=S.fav.filter(x=>x!==cur):S.fav.push(cur);save();stats();};
$('tabDraw').onclick=()=>setView('draw');
$('tabAll').onclick=()=>setView('all');
$('btnCal').onclick=()=>setView(view==='cal'?'all':'cal');
cardEl.onclick=()=>{if(cur<0)return;
  const o=document.createElement('div');o.className='focus-overlay';
  o.innerHTML=cardHTML(cur,true)+'<button class="focus-close" aria-label="Fechar">✕</button>';
  o.querySelector('.focus-close').onclick=e=>{e.stopPropagation();o.remove()};
  o.onclick=()=>o.remove();document.body.appendChild(o);};
cardEl.onkeydown=e=>{if(e.key==='Enter')cardEl.onclick()};

// Perfis
function pickUser(force){
  if(S.user&&!force){$('userChip').textContent='👤 '+S.user;return}
  const o=document.createElement('div');o.className='profile-overlay';
  o.innerHTML=`<h2>Quem está aí?</h2><p>Escolha seu perfil — tudo que você criar fica assinado por você.</p>
    ${USERS.map(u=>`<button class="pbtn" data-u="${u}">${u}</button>`).join('')}`;
  o.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>{S.user=b.dataset.u;save();$('userChip').textContent='👤 '+S.user;o.remove()});
  document.body.appendChild(o);
}
$('userChip').onclick=()=>pickUser(true);

// Ideias do time
const fab=document.createElement('button');fab.className='idea-fab';fab.textContent='+ Ideia';
fab.onclick=()=>{
  const scrim=document.createElement('div');scrim.className='scrim';
  const md=document.createElement('div');md.className='idea-modal';
  md.innerHTML=`<h3>💡 Nova ideia de ignição</h3>
    <textarea id="ideaTxt" placeholder="Escreva a ideia: uma pergunta, tese, tema, citação…"></textarea>
    <select class="tema-sel" id="ideaCat"><option value="">categoria sugerida (opcional)</option>
      ${Object.entries(CATS).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join('')}</select>
    <div class="actions"><button class="act draw" id="ideaSave">Adicionar ao acervo</button></div>`;
  const close=()=>{scrim.remove();md.remove()};
  scrim.onclick=close;
  document.body.append(scrim,md);
  md.querySelector('#ideaSave').onclick=()=>{
    const txt=md.querySelector('#ideaTxt').value.trim();
    if(!txt)return;
    const d=new Date();
    S.ideas.unshift({txt,cat:md.querySelector('#ideaCat').value||null,by:S.user||'?',dt:`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`});
    save();close();setView('all');
  };
};
document.body.appendChild(fab);

const arrow=$('chipArrow');
arrow.onclick=()=>chipsEl.scrollBy({left:200});
const arrowCheck=()=>arrow.classList.toggle('off',chipsEl.scrollLeft>=chipsEl.scrollWidth-chipsEl.clientWidth-8);
chipsEl.addEventListener('scroll',arrowCheck);
addEventListener('resize',arrowCheck);
renderChips();draw();setView('all');arrowCheck();pickUser(false);renderAlert();
</script>
