<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ignição · PH</title>
<style>
  :root{
    --bg:#0a0d0f; --card:#11181c; --card2:#161f24; --line:#233037;
    --ember:#2fc7e8; --ember-soft:rgba(47,199,232,.13);
    --text:#eef5f7; --muted:#94a6ae; --dim:#5f7178;
    --disp:'Avenir Next Condensed','Arial Narrow',system-ui,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}
  body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.5;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px 90px}

  header{padding:22px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .brand{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:15px}
  .brand em{color:var(--ember);font-style:normal}
  .stats{font-size:12px;color:var(--dim);letter-spacing:.04em;font-variant-numeric:tabular-nums}

  .chipwrap{position:relative}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:6px 34px 14px 0;scrollbar-width:none;scroll-behavior:smooth}
  .chips::-webkit-scrollbar{display:none}
  .chip-arrow{position:absolute;right:-2px;top:2px;bottom:10px;width:56px;border:none;cursor:pointer;
    background:linear-gradient(90deg,transparent,var(--bg) 55%);color:var(--ember);
    font-size:22px;font-weight:700;text-align:right;padding-right:4px;transition:opacity .2s}
  .chip-arrow.off{opacity:0;pointer-events:none}
  .chip{flex:0 0 auto;font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    font-size:12.5px;color:var(--muted);border:1px solid var(--line);background:transparent;
    padding:7px 13px;border-radius:99px;cursor:pointer;transition:.15s}
  .chip.on{color:var(--bg);background:var(--ember);border-color:var(--ember)}

  /* CARTÃO DE IGNIÇÃO */
  .stage{margin-top:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 26px 24px;
    min-height:340px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
  .card::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--ember),transparent 70%)}
  .mode{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:12.5px;color:var(--ember)}
  .pre{font-size:13.5px;color:var(--dim);font-style:italic}
  .txt{font-family:var(--disp);font-weight:600;font-size:clamp(25px,6.4vw,34px);line-height:1.14;text-wrap:balance;flex:1}
  .who{font-size:13.5px;color:var(--muted);letter-spacing:.02em}
  .who b{color:var(--text);font-weight:600}
  .hook{border-left:2px solid var(--ember);padding:2px 0 2px 12px;font-size:14.5px;color:var(--muted)}
  .hook b{color:var(--ember);font-weight:600;letter-spacing:.06em;font-size:12px;text-transform:uppercase;font-family:var(--disp);display:block;margin-bottom:2px}
  .state{position:absolute;top:16px;right:18px;font-size:12px;color:var(--dim);display:flex;gap:8px}
  .state span{border:1px solid var(--line);border-radius:99px;padding:2px 9px}
  .state .fav{color:#e8b04c;border-color:#4a3c22}
  .state .used{color:var(--muted)}

  .actions{display:flex;gap:10px;margin-top:14px}
  button.act{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:14px;
    border-radius:10px;padding:15px 10px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);flex:1;transition:.15s}
  button.act:active{transform:scale(.97)}
  .draw{background:var(--ember)!important;color:#04161c!important;border-color:var(--ember)!important;flex:1.6!important;font-size:15px!important}
  .toggled{color:var(--ember)!important;border-color:var(--ember)!important}

  .hint{text-align:center;color:var(--dim);font-size:12px;margin-top:14px;letter-spacing:.03em}

  /* ACERVO */
  .tabs{display:flex;gap:22px;margin:30px 0 6px;border-bottom:1px solid var(--line)}
  .tab{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:14px;
    color:var(--dim);background:none;border:none;padding:10px 2px;cursor:pointer;border-bottom:2px solid transparent}
  .tab.on{color:var(--text);border-bottom-color:var(--ember)}
  .group-h{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:14px;
    color:var(--ember);margin:30px 0 10px;display:flex;align-items:baseline;gap:10px}
  .group-h small{color:var(--dim);font-size:12px;letter-spacing:.06em;font-family:var(--body);font-weight:400}
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ember);border-radius:10px;transition:.12s}
  .row:active{transform:scale(.99)}
  .row .body{flex:1;min-width:0}
  .row p{font-size:15.5px;color:var(--text);font-weight:500;line-height:1.4}
  .row .src{font-size:12.5px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
  .row.u{border-left-color:var(--line)}
  .row.u p{color:var(--dim);font-weight:400}
  .row .m{font-size:14px;flex:0 0 auto;padding-top:2px;color:var(--muted)}
  .row .m .fv{color:#e8c04c}
  .empty{color:var(--dim);font-size:14px;padding:30px 0;text-align:center}
  .hidden{display:none}

  /* CALENDÁRIO */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 6px}
  .cal-head h2{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:19px}
  .cal-nav{display:flex;gap:8px}
  .cal-nav button{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:8px;
    width:38px;height:38px;font-size:17px;cursor:pointer}
  .cal-streak{font-size:12.5px;color:var(--dim);margin-bottom:14px;letter-spacing:.03em}
  .cal-streak b{color:var(--ember)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .cal-wd{font-family:var(--disp);font-weight:700;font-size:11.5px;color:var(--dim);text-align:center;
    text-transform:uppercase;letter-spacing:.08em;padding:4px 0}
  .cal-d{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:74px;padding:6px 5px 5px;
    cursor:pointer;display:flex;flex-direction:column;gap:3px;position:relative;transition:.12s;min-width:0;overflow:hidden}
  @media(max-width:420px){.cal-d .tag{font-size:9px;letter-spacing:.02em}.cal-d{min-height:66px;padding:5px 3px 4px}}
  .cal-d:active{transform:scale(.96)}
  .cal-d .n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .cal-d .tag{font-family:var(--disp);font-weight:600;font-size:10.5px;line-height:1.15;text-transform:uppercase;
    letter-spacing:.04em;color:var(--ember);text-wrap:balance}
  .cal-d.free{background:transparent;cursor:default}
  .cal-d.free .tag{color:var(--dim);font-weight:400}
  .cal-d.out{opacity:.28}
  .cal-d.today{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}
  .cal-d.done{background:var(--ember-soft);border-color:transparent}
  .cal-d .ok{position:absolute;bottom:4px;right:6px;font-size:12px;color:var(--ember)}
  .cal-legend{margin-top:18px;display:flex;flex-direction:column;gap:6px}
  .cal-legend .lg{font-size:13px;color:var(--muted)}
  .cal-legend .lg b{color:var(--text);font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:12.5px;font-weight:700}
  /* painel do dia */
  .day-panel{position:fixed;inset:auto 0 0 0;background:var(--card2);border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;padding:26px 22px 34px;z-index:60;max-width:640px;margin:0 auto}
  .day-panel .mode{margin-bottom:4px}
  .day-panel h3{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:23px;letter-spacing:.03em;margin-bottom:4px}
  .day-panel .cats{color:var(--muted);font-size:14px;margin-bottom:18px}
  .day-panel .actions{margin-top:0}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}

  /* MODO FOCO */
  .focus-overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;
    justify-content:center;padding:8vw;gap:22px}
  .focus-overlay .txt{font-size:clamp(30px,8vw,52px);flex:0}
  .focus-close{position:absolute;top:20px;right:22px;background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:99px;width:38px;height:38px;font-size:16px;cursor:pointer}
  .rec{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--disp);font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:#d43c3c;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  button:focus-visible,.chip:focus-visible,.row:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
</style>

<div class="wrap">
  <header>
    <div class="brand">Ignição <em>·</em> PH</div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="chipwrap">

  <div class="tabs">

    <button class="tab" id="tabCal">Calendário</button>
    <button class="tab" id="tabDraw">Sorteio</button>
  </div>

  <section class="stage" id="stage">
    <div class="card" id="card" role="button" tabindex="0" title="Toque para modo foco"></div>
    <div class="actions">
      <button class="act draw" id="btnDraw">🎲 Me provoca</button>
      <button class="act" id="btnUsed">✓ Gravei</button>

  </section>

  <section id="list" class="hidden"></section>
  <section id="cal" class="hidden"></section>
</div>

// Grade editorial semanal: dia da semana → tema + categorias de ignição
const PLAN={
  1:{t:'Operação & decisão',cats:['per','ten']},
  2:{t:'Produto & tecnologia',cats:['tes','tem']},
  3:{t:'Autoridade & visão',cats:['ceo','mar']},
  4:{t:'Vida real & bastidor',cats:['pov','col']},
  5:{t:'Insight da Semana',cats:['sto','liv','tri']},
  6:{t:'Livre · stories',cats:[]},
  0:{t:'Livre · stories',cats:[]}
};
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const K='ignicao-ph-v1';
let S=JSON.parse(localStorage.getItem(K)||'{"used":[],"fav":[]}');
S.days=S.days||{};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
let filter=null, cur=-1, showUsed=false, view='all';
let calRef=new Date();

const $=id=>document.getElementById(id);
const chipsEl=$('chips'), cardEl=$('card'), statsEl=$('stats'), listEl=$('list');

function pool(){
  return DATA.map((d,i)=>i).filter(i=>(!filter||DATA[i][0]===filter)&&(showUsed||!S.used.includes(i)));
}
function renderChips(){
  let h=`<button class="chip ${!filter?'on':''}" data-c="">Tudo</button>`;
  for(const c in CATS){h+=`<button class="chip ${filter===c?'on':''}" data-c="${c}">${CATS[c].n}</button>`}
  chipsEl.innerHTML=h;
  chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.c||null;renderChips();view==='draw'?draw():renderList();});
}
function stats(){
  statsEl.textContent=`${pool().length} disponíveis · ${S.used.length} gravadas`;
  $('btnUsed').textContent=S.used.includes(cur)?'↩ Desmarcar':'✓ Gravei';
  $('btnFav').textContent=S.fav.includes(cur)?'★':'☆';
  $('btnFav').classList.toggle('toggled',S.fav.includes(cur));
}
function cardHTML(i,focus){
  const [c,t,w,h]=DATA[i];
  return `${focus?'<div class="rec"><span class="dot"></span>Pensando alto</div>':''}
    <div class="state">${S.fav.includes(i)?'<span class="fav">★ favorita</span>':''}${S.used.includes(i)?'<span class="used">✓ gravada</span>':''}</div>
    <div class="mode">${CATS[c].n}</div>
    <div class="pre">${CATS[c].pre}</div>
    <div class="txt">${t}</div>
    ${w?`<div class="who">— <b>${w}</b></div>`:''}
    ${h?`<div class="hook"><b>Gancho pro seu mundo</b>${h}</div>`:''}`;
}
function draw(){
  const p=pool().filter(i=>i!==cur);
  if(!p.length){cardEl.innerHTML='<div class="mode">Acervo esgotado</div><div class="txt">Você gravou tudo desta categoria. 🔥<br>Desmarque algumas ou mude o filtro.</div>';cur=-1;stats();return}
  cur=p[Math.floor(Math.random()*p.length)];
  cardEl.innerHTML=cardHTML(cur,false);
  stats();
}
function renderList(){
  let h='';
  for(const c in CATS){
    const items=DATA.map((d,i)=>i).filter(i=>DATA[i][0]===c&&(!filter||filter===c));
    if(!items.length)continue;
    const done=items.filter(i=>S.used.includes(i)).length;
    h+=`<div class="group-h">${CATS[c].n}<small>${items.length} ignições${done?` · ${done} gravadas`:''}</small></div><div class="rows">`;
    for(const i of items){
      const [,t,w]=DATA[i];
      h+=`<div class="row ${S.used.includes(i)?'u':''}" data-i="${i}" tabindex="0">
        <div class="body"><p>${t}</p>${w?`<div class="src">— ${w}</div>`:''}</div>
        <span class="m">${S.fav.includes(i)?'<span class="fv">★</span>':''}${S.used.includes(i)?' ✓':''}</span></div>`;
    }
    h+=`</div>`;
  }
  listEl.innerHTML=h||'<div class="empty">Nada aqui.</div>';
  listEl.querySelectorAll('.row').forEach(r=>r.onclick=()=>{cur=+r.dataset.i;setView('draw');cardEl.innerHTML=cardHTML(cur,false);stats();});
}
function setView(v){
  view=v;
  $('tabDraw').classList.toggle('on',v==='draw');
  $('tabAll').classList.toggle('on',v==='all');
  $('tabCal').classList.toggle('on',v==='cal');
  $('stage').classList.toggle('hidden',v!=='draw');
  listEl.classList.toggle('hidden',v!=='all');
  $('cal').classList.toggle('hidden',v!=='cal');
  if(v==='all')renderList();
  if(v==='cal')renderCal();
}
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function weekScore(){
  const now=new Date(), dow=now.getDay()||7, mon=new Date(now); mon.setDate(now.getDate()-(dow-1));
  let done=0;
  for(let i=0;i<5;i++){const d=new Date(mon); d.setDate(mon.getDate()+i); if(S.days[iso(d)])done++;}
  return done;
}
function renderCal(){
  const y=calRef.getFullYear(), m=calRef.getMonth();
  const first=new Date(y,m,1), start=(first.getDay()+6)%7, nd=new Date(y,m+1,0).getDate();
  const today=iso(new Date());
  let h=`<div class="cal-head"><h2>${MESES[m]} ${y}</h2>
    <div class="cal-nav"><button id="calPrev" aria-label="Mês anterior">‹</button><button id="calNext" aria-label="Próximo mês">›</button></div></div>
    <div class="cal-streak">Esta semana: <b>${weekScore()}/5 gravações</b> · toque no dia para sortear a ignição ou marcar gravado</div>
    <div class="cal-grid">`;
  for(const w of ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'])h+=`<div class="cal-wd">${w}</div>`;
  for(let i=0;i<start;i++)h+=`<div></div>`;
  for(let d=1;d<=nd;d++){
    const dt=new Date(y,m,d), k=iso(dt), p=PLAN[dt.getDay()], free=!p.cats.length;
    h+=`<div class="cal-d ${free?'free':''} ${k===today?'today':''} ${S.days[k]?'done':''}" data-k="${k}" data-dow="${dt.getDay()}">
      <span class="n">${d}</span><span class="tag">${p.t}</span>${S.days[k]?'<span class="ok">✓</span>':''}</div>`;
  }
  h+=`</div><div class="cal-legend">`;
  for(let i=1;i<=5;i++){const p=PLAN[i];
    h+=`<div class="lg"><b>${['','Seg','Ter','Qua','Qui','Sex'][i]} — ${p.t}:</b> ${p.cats.map(c=>CATS[c].n).join(' · ')}</div>`;}
  h+=`</div>`;
  $('cal').innerHTML=h;
  $('calPrev').onclick=()=>{calRef=new Date(y,m-1,1);renderCal()};
  $('calNext').onclick=()=>{calRef=new Date(y,m+1,1);renderCal()};
  $('cal').querySelectorAll('.cal-d:not(.free)').forEach(el=>el.onclick=()=>dayPanel(el.dataset.k,+el.dataset.dow));
}
function dayPanel(k,dow){
  const p=PLAN[dow], done=!!S.days[k];
  const [yy,mm,dd]=k.split('-');
  const scrim=document.createElement('div');scrim.className='scrim';
  const panel=document.createElement('div');panel.className='day-panel';
  panel.innerHTML=`<div class="mode">${dd}/${mm}</div><h3>${p.t}</h3>
    <div class="cats">Ignições do dia: ${p.cats.map(c=>CATS[c].n).join(' · ')}</div>
    <div class="actions">
      <button class="act draw" id="dpDraw">🎲 Sortear ignição do dia</button>
      <button class="act ${done?'toggled':''}" id="dpDone">${done?'✓ Gravado':'Marcar gravado'}</button>
    </div>`;
  const close=()=>{scrim.remove();panel.remove()};
  scrim.onclick=close;
  document.body.append(scrim,panel);
  panel.querySelector('#dpDraw').onclick=()=>{
    const p2=DATA.map((d,i)=>i).filter(i=>p.cats.includes(DATA[i][0])&&!S.used.includes(i));
    close();setView('draw');
    if(p2.length){cur=p2[Math.floor(Math.random()*p2.length)];cardEl.innerHTML=cardHTML(cur,false);stats();}
    else draw();
    window.scrollTo({top:0});
  };
  panel.querySelector('#dpDone').onclick=()=>{S.days[k]=!S.days[k];if(!S.days[k])delete S.days[k];save();close();renderCal();};
}
$('btnDraw').onclick=draw;
$('btnUsed').onclick=()=>{if(cur<0)return;S.used.includes(cur)?S.used=S.used.filter(x=>x!==cur):S.used.push(cur);save();stats();};
$('btnFav').onclick=()=>{if(cur<0)return;S.fav.includes(cur)?S.fav=S.fav.filter(x=>x!==cur):S.fav.push(cur);save();stats();};
$('tabDraw').onclick=()=>setView('draw');
$('tabAll').onclick=()=>setView('all');
$('tabCal').onclick=()=>setView('cal');
cardEl.onclick=()=>{if(cur<0)return;
  const o=document.createElement('div');o.className='focus-overlay';
  o.innerHTML=cardHTML(cur,true)+'<button class="focus-close" aria-label="Fechar">✕</button>';
  o.querySelector('.focus-close').onclick=e=>{e.stopPropagation();o.remove()};
  o.onclick=()=>o.remove();document.body.appendChild(o);};
cardEl.onkeydown=e=>{if(e.key==='Enter')cardEl.onclick()};

const arrow=$('chipArrow');
arrow.onclick=()=>chipsEl.scrollBy({left:200});
const arrowCheck=()=>arrow.classList.toggle('off',chipsEl.scrollLeft>=chipsEl.scrollWidth-chipsEl.clientWidth-8);
chipsEl.addEventListener('scroll',arrowCheck);
addEventListener('resize',arrowCheck);
renderChips();draw();setView('all');arrowCheck();
</script>
